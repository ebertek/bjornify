[package]
name = "bjornify-connect-auth-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
librespot-core = "=0.8.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "1"

# librespot-core 0.8.0 build script requires vergen-lib 0.1.x.
# Pin its vergen peer to avoid the incompatible vergen 9.1.x minor bump.
# Upstream fix: https://github.com/librespot-org/librespot/pull/1683
[build-dependencies]
vergen = "=10.0.3"
