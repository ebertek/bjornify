---
name: Spotify Connect validation

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "spotify-connect/**"
      - "bjornify/**"
      - ".dockerignore"
      - ".github/workflows/spotify-connect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path spotify-connect/Cargo.toml --all -- --check
      - name: Compile Spotify Connect client
        run: cargo check --manifest-path spotify-connect/Cargo.toml
      - name: Test guarded Connect command and URI validation
        run: cargo test --manifest-path spotify-connect/Cargo.toml
      - name: Build production Connect executable
        run: cargo build --release --manifest-path spotify-connect/Cargo.toml
      - name: Verify production Docker image includes librespot
        run: |
          docker build --file bjornify/Dockerfile --tag bjornify:connect-ci .
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -x /usr/local/bin/bjornify-connect
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -f /app/connect_playback_auth.py
