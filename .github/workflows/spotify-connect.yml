---
name: Spotify Connect validation

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "spotify-connect/**"
      - "bjornify/**"
      - ".dockerignore"
      - ".github/workflows/spotify-connect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path spotify-connect/Cargo.toml --all -- --check
      - name: Cache Rust dependencies and test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spotify-connect
          cache-on-failure: true
      - name: Test guarded Connect command and URI validation
        run: cargo test --manifest-path spotify-connect/Cargo.toml
      # The Docker build below already compiles the production release executable.
      # Avoid building it separately on the runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bjornify/Dockerfile
          load: true
          tags: bjornify:connect-ci
          cache-from: type=gha,scope=spotify-connect-ci
          cache-to: type=gha,scope=spotify-connect-ci,mode=max
      - name: Verify production Docker image includes librespot
        run: |
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -x /usr/local/bin/bjornify-connect
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -f /app/connect_playback_auth.py
      - name: Verify CLI, clean runtime layout, and arbitrary UID name resolution
        run: |
          docker run --rm --entrypoint /usr/local/bin/bjornify bjornify:connect-ci --help
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci ! -e /app/Dockerfile
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci ! -e /app/requirements.txt
          # Keep the application immutable while allowing only private state paths
          # to be written by the default unprivileged UID.
          docker run --rm --entrypoint /bin/bash bjornify:connect-ci -ec '
            test "$(id -u)" -eq 10001
            test "$(id -g)" -eq 10001
            ! getent passwd appuser >/dev/null
            test "$(stat -c "%u:%g %a" /app)" = "0:0 755"
            test "$(stat -c "%u:%g %a" /app/bjornify.py)" = "0:0 644"
            test "$(stat -c "%u:%g %a" /app/wrapper.sh)" = "0:0 755"
            test "$(stat -c "%u:%g %a" /usr/local/bin/bjornify)" = "0:0 755"
            test "$(stat -c "%u:%g %a" /app/logs)" = "10001:10001 750"
            test "$(stat -c "%u:%g %a" /app/secrets)" = "10001:10001 700"
            test ! -w /app
            test ! -w /app/bjornify.py
            test -w /app/logs
            test -w /app/secrets
            /app/wrapper.sh >/tmp/default-startup.log 2>&1 || true
            ! grep -q NWRAP_ERROR /tmp/default-startup.log
            test "$(whoami)" = bjornify
            test "$(id -gn)" = bjornify
          '
          # Arbitrary Compose numeric UID/GID values still work; source is
          # readable but not writable, and NSS resolves the effective user.
          bootstrap_output="$(mktemp)"
          docker run --rm --user 23456:23456 --entrypoint /bin/bash bjornify:connect-ci -ec '
            /app/wrapper.sh >/tmp/bootstrap.log 2>&1 || true
            ! grep -q NWRAP_ERROR /tmp/bootstrap.log
            test "$(whoami)" = bjornify
            test "$(id -gn)" = bjornify
            test -r /app/bjornify.py
            test ! -w /app/bjornify.py
          ' >"$bootstrap_output" 2>&1 || {
            cat "$bootstrap_output"
            rm -f "$bootstrap_output"
            exit 1
          }
          if grep -q NWRAP_ERROR "$bootstrap_output"; then
            cat "$bootstrap_output"
            rm -f "$bootstrap_output"
            exit 1
          fi
          rm -f "$bootstrap_output"
          # Preserve already defined groups when Compose changes only the UID.
          docker run --rm --user 23456:100 --entrypoint /bin/bash bjornify:connect-ci -ec '
            /app/wrapper.sh >/tmp/group-startup.log 2>&1 || true
            ! grep -q NWRAP_ERROR /tmp/group-startup.log
            test "$(whoami)" = bjornify
            test "$(id -gn)" = users
          '

      - name: Test no-new-privileges, dropped capabilities, and read-only rootfs
        run: |
          # Verify each protection independently.
          docker run --rm --security-opt no-new-privileges:true \
            --entrypoint /bin/bash bjornify:connect-ci -ec '
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
            '
          docker run --rm --cap-drop ALL \
            --entrypoint /bin/bash bjornify:connect-ci -ec '
              grep -Eq "^CapBnd:[[:space:]]+0+$" /proc/self/status
            '
          readonly_output="$(docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 \
            --entrypoint /bin/bash bjornify:connect-ci -ec '
              /app/wrapper.sh >/tmp/bootstrap.log 2>&1 || true
              ! grep -q NWRAP_ERROR /tmp/bootstrap.log
              test "$(whoami)" = bjornify
              test -s /run/bjornify-identity/passwd
              test ! -w /app/bjornify.py
              test ! -w /app
              touch /tmp/tempfile-test
            ' 2>&1)"
          if grep -q NWRAP_ERROR <<<"$readonly_output"; then
            printf '%s\n' "$readonly_output"
            exit 1
          fi
          # Combined test with arbitrary numeric user, persistent state
          # simulated using writable, correctly owned tmpfs mounts.
          hardened_output="$(docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user 23456:100 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 \
            --tmpfs /app/logs:rw,nosuid,nodev,noexec,uid=23456,gid=100,mode=0750 \
            --tmpfs /app/secrets:rw,nosuid,nodev,noexec,uid=23456,gid=100,mode=0700 \
            --entrypoint /bin/bash bjornify:connect-ci -ec '
              /app/wrapper.sh >/tmp/bootstrap.log 2>&1 || true
              ! grep -q NWRAP_ERROR /tmp/bootstrap.log
              test "$(whoami)" = bjornify
              test "$(id -u)" -eq 23456
              test "$(id -gn)" = users
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^CapBnd:[[:space:]]+0+$" /proc/self/status
              test ! -w /app
              test ! -w /app/bjornify.py
              test -w /app/logs
              test -w /app/secrets
              touch /app/logs/smoke-test /app/secrets/smoke-test
              python -c "import socket; s=socket.socket(); s.bind((str(),8765)); s.close()"
              python /app/cli.py --help >/dev/null
            ' 2>&1)"
          if grep -q NWRAP_ERROR <<<"$hardened_output"; then
            printf '%s\n' "$hardened_output"
            exit 1
          fi
