---
name: Spotify Connect validation

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "spotify-connect/**"
      - "bjornify/**"
      - ".dockerignore"
      - ".github/workflows/spotify-connect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path spotify-connect/Cargo.toml --all -- --check
      - name: Cache Rust dependencies and test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spotify-connect
          cache-on-failure: true
      - name: Test guarded Connect command and URI validation
        run: cargo test --manifest-path spotify-connect/Cargo.toml
      # The Docker build below already compiles the production release executable.
      # Avoid building it separately on the runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bjornify/Dockerfile
          load: true
          tags: bjornify:connect-ci
          cache-from: type=gha,scope=spotify-connect-ci
          cache-to: type=gha,scope=spotify-connect-ci,mode=max
      - name: Verify production Docker image includes librespot
        run: |
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -x /usr/local/bin/bjornify-connect
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -f /app/connect_playback_auth.py
      - name: Verify CLI, clean runtime layout, and arbitrary UID name resolution
        run: |
          docker run --rm --entrypoint /usr/local/bin/bjornify bjornify:connect-ci --help
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci ! -e /app/Dockerfile
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci ! -e /app/requirements.txt
          # No extra appuser exists; the numeric image default must be non-root.
          docker run --rm --entrypoint /bin/bash bjornify:connect-ci -ec '
            test "$(id -u)" -eq 10001
            test "$(id -g)" -eq 10001
            ! getent passwd appuser >/dev/null
            test "$(stat -c %u /app/bjornify.py)" -eq 10001
            /app/wrapper.sh >/tmp/default-startup.log 2>&1 || true
            ! grep -q NWRAP_ERROR /tmp/default-startup.log
            test "$(whoami)" = bjornify
            test "$(id -gn)" = bjornify
          '
          bootstrap_output="$(mktemp)"
          docker run --rm --user 23456:23456 --entrypoint /bin/bash bjornify:connect-ci -ec '
            /app/wrapper.sh >/tmp/bootstrap.log 2>&1 || true
            ! grep -q NWRAP_ERROR /tmp/bootstrap.log
            test "$(whoami)" = bjornify
            test "$(id -gn)" = bjornify
          ' >"$bootstrap_output" 2>&1 || {
            cat "$bootstrap_output"
            rm -f "$bootstrap_output"
          # Retain existing group names when Compose overrides only the UID.
          docker run --rm --user 23456:100 --entrypoint /bin/bash bjornify:connect-ci -ec '
            /app/wrapper.sh >/tmp/group-startup.log 2>&1 || true
            ! grep -q NWRAP_ERROR /tmp/group-startup.log
            test "$(whoami)" = bjornify
            test "$(id -gn)" = users
          '
            exit 1
          }
          if grep -q NWRAP_ERROR "$bootstrap_output"; then
            cat "$bootstrap_output"
            rm -f "$bootstrap_output"
            exit 1
          fi
          rm -f "$bootstrap_output"
