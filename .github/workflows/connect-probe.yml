---
name: Spotify Connect build validation

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "experiments/connect-probe/**"
      - "bjornify/**"
      - ".dockerignore"
      - ".github/workflows/connect-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path experiments/connect-probe/Cargo.toml --all -- --check
      - name: Check read-only Connect probe compiles
        run: cargo check --manifest-path experiments/connect-probe/Cargo.toml
      - name: Test guarded Connect command and URI validation
        run: cargo test --manifest-path experiments/connect-probe/Cargo.toml
      - name: Build deployable probe executable
        run: cargo build --release --manifest-path experiments/connect-probe/Cargo.toml
      - name: Verify standalone Docker image builds
        run: docker build --file experiments/connect-probe/Dockerfile --tag bjornify-connect-auth-probe:ci .
      - name: Verify production Docker image includes librespot
        run: |
          docker build --file bjornify/Dockerfile --tag bjornify:connect-ci .
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -x /usr/local/bin/bjornify-connect
          docker run --rm --entrypoint /usr/bin/test bjornify:connect-ci -f /app/connect_playback_auth.py
