---
name: Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    # Only publish a successful push-to-main linted revision.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify validated revision
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Generate version.py
        run: python scripts/generate_version.py

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c 'from bjornify.version import __version__; print(__version__)')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bjornify/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_DATE=${{ github.event.workflow_run.created_at }}
            GITHUB_SHA=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ steps.version.outputs.value }}
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Generate version.py
        run: python scripts/generate_version.py

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c 'from bjornify.version import __version__; print(__version__)')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:main" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
