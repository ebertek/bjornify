---
name: Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    # Never publish a PR or a fork's successful Lint run.
    # Only the validated push to this repository's main may release images.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bjornify

    steps:
      - name: Checkout the validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify the checkout matches the successful Lint run
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          echo "Publishing validated commit $VALIDATED_SHA"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Generate version.py
        run: |
          mkdir -p bjornify
          python scripts/generate_version.py

      - name: Read generated version
        id: get_version
        run: |
          VERSION=$(python -c 'from bjornify.version import __version__; print(__version__)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set build date
        id: set_build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Bust only the pip-install layer for each release attempt.
          build-args: |
            BUILD_DATE=${{ steps.set_build_date.outputs.date }}
            GITHUB_SHA=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ steps.get_version.outputs.version }}
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          context: .
          file: bjornify/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: true
          push: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
            ${{ steps.meta.outputs.tags }}
